name: Peanuts Free Camera - APK experimental

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply Free Camera changes
        run: |
          git apply --check freecam.patch
          git apply freecam.patch

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v4.0.3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'

      - name: Setup Dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh ninja-build cmake clang curl build-essential pkg-config

      - name: Build NX Pack Stage
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          zsh peanuts/scripts/ondevice-stage.sh "$RUNNER_TEMP/nxpacker"

      - name: Compile experimental APK
        working-directory: android/app
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon -PnxPackStage="$RUNNER_TEMP/nxpacker/stage" -PnxApp=peanuts -PnxAppId=freecam -PnxLabel='Peanuts Free Camera TEST' -PnxGames=01002DA013484000 apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: peanuts-freecam-test-apk
          path: android/app/out/*.apk
          if-no-files-found: error
