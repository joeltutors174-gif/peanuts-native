name: Peanuts Pro FreeCam Full - Catalog

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply Free Camera changes
        run: |
          git apply --check freecam.patch
          git apply freecam.patch

      - name: Customize Peanuts Pro FreeCam
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/java/dev/nxnative/android/MainActivity.java")
          s = p.read_text()

          old = 'Ui.badge(this, 44), "Peanuts Native", Prefs.buildId(), trailing'
          new = 'customLogo(), "Peanuts Pro FreeCam", "Full Catalog v1.1", trailing'

          assert old in s, "Home header not found"
          s = s.replace(old, new, 1)

          marker = "    private void buildHome("
          assert marker in s

          s = s.replace(marker, """
              private View customLogo() {
                  ImageView logo = new ImageView(this);
                  logo.setImageResource(R.drawable.peanuts_pro_freecam_icon);
                  logo.setScaleType(ImageView.ScaleType.FIT_CENTER);
                  logo.setLayoutParams(new LinearLayout.LayoutParams(
                      Ui.dp(this, 44), Ui.dp(this, 44)));
                  return logo;
              }

          """ + marker, 1)

          p.write_text(s)
          PY

      - name: Add supported games catalog
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("android/app/src/main/java")
          p = root / "dev/peanuts/ui/SettingsSections.java"
          s = p.read_text()
          marker = '            new Section("console",'
          assert s.count(marker) == 1
          p.write_text(s.replace(marker, '            new Section("supported_games", "Supported Games", "game", "Browse the game profiles included in this APK."),\n' + marker, 1))
          p = root / "dev/peanuts/ui/SettingsPage.java"
          s = p.read_text()
          marker = '        if (s.key.equals("about")) { AboutPage.fill'
          assert s.count(marker) == 1
          p.write_text(s.replace(marker, '        if (s.key.equals("supported_games")) { dev.nxnative.android.SupportedGames.fill(a, col); return col; }\n' + marker, 1))
          p = root / "dev/nxnative/android/SupportedGames.java"
          assert not p.exists()
          p.write_text("package dev.nxnative.android;\n\nimport android.app.Activity;\nimport android.graphics.Bitmap;\nimport android.graphics.BitmapFactory;\nimport android.widget.*;\nimport android.view.View;\nimport android.text.TextWatcher;\nimport android.text.Editable;\nimport java.io.File;\nimport java.util.*;\n\npublic final class SupportedGames {\n    private SupportedGames() {}\n    private static int dp(Activity a, int n) {\n        return Math.round(n * a.getResources().getDisplayMetrics().density);\n    }\n    private static TextView text(Activity a, String s, int size, int color) {\n        TextView t = new TextView(a);\n        t.setText(s); t.setTextSize(size); t.setTextColor(a.getColor(color));\n        return t;\n    }\n    public static void fill(Activity a, LinearLayout page) {\n        List<Profile> games = new ArrayList<>(Profile.all());\n        games.sort(Comparator.comparing(p -> p.name, String.CASE_INSENSITIVE_ORDER));\n        EditText search = new EditText(a);\n        search.setSingleLine(true);\n        search.setHint(\"Search games or Title ID\");\n        search.setTextColor(a.getColor(R.color.bn_text));\n        search.setHintTextColor(a.getColor(R.color.bn_text_2));\n        page.addView(search);\n        TextView count = text(a, \"\", 14, R.color.bn_text_2);\n        page.addView(count);\n        LinearLayout list = new LinearLayout(a);\n        list.setOrientation(LinearLayout.VERTICAL);\n        page.addView(list);\n        Runnable render = () -> {\n            String q = search.getText().toString().trim().toLowerCase(Locale.ROOT);\n            list.removeAllViews();\n            int visible = 0;\n            for (Profile p : games) {\n                if (!(p.name + \" \" + p.titleId).toLowerCase(Locale.ROOT).contains(q)) continue;\n                visible++;\n                LinearLayout row = new LinearLayout(a);\n                row.setGravity(android.view.Gravity.CENTER_VERTICAL);\n                row.setPadding(dp(a,8),dp(a,8),dp(a,8),dp(a,8));\n                row.setBackgroundColor(a.getColor(R.color.bn_card));\n                LinearLayout.LayoutParams rp = new LinearLayout.LayoutParams(-1,-2);\n                rp.topMargin = dp(a,6);\n                list.addView(row,rp);\n                File icon = new File(a.getFilesDir(), \"icons/\" + p.titleId + \".png\");\n                Bitmap bitmap = null;\n                if (icon.isFile()) {\n                    BitmapFactory.Options opts = new BitmapFactory.Options();\n                    opts.inSampleSize = 2;\n                    bitmap = BitmapFactory.decodeFile(icon.getPath(),opts);\n                }\n                if (bitmap != null) {\n                    ImageView image = new ImageView(a);\n                    image.setImageBitmap(bitmap);\n                    image.setScaleType(ImageView.ScaleType.CENTER_CROP);\n                    row.addView(image,new LinearLayout.LayoutParams(dp(a,64),dp(a,64)));\n                } else {\n                    TextView placeholder = text(a,\"🎮\",24,R.color.bn_text);\n                    placeholder.setGravity(android.view.Gravity.CENTER);\n                    row.addView(placeholder,new LinearLayout.LayoutParams(dp(a,64),dp(a,64)));\n                }\n                LinearLayout info = new LinearLayout(a);\n                info.setOrientation(LinearLayout.VERTICAL);\n                info.setPadding(dp(a,12),0,0,0);\n                row.addView(info,new LinearLayout.LayoutParams(0,-2,1));\n                TextView title = text(a,p.name,16,R.color.bn_text);\n                title.setTypeface(null,android.graphics.Typeface.BOLD);\n                info.addView(title);\n                String versions = p.supportedShort();\n                info.addView(text(a,versions.isEmpty() ? \"Version not specified\" : \"Versions: \" + versions,13,R.color.bn_text_2));\n                info.addView(text(a,p.titleId,12,R.color.bn_text_2));\n                info.addView(text(a,\"bring-up\".equalsIgnoreCase(p.status) ? \"Experimental profile\" : \"Profile included\",12,R.color.bn_accent));\n            }\n            count.setText(visible + \" / \" + games.size() + \" games · Profiles do not guarantee flawless gameplay\");\n        };\n        search.addTextChangedListener(new TextWatcher() {\n            public void beforeTextChanged(CharSequence s,int start,int count,int after) {}\n            public void onTextChanged(CharSequence s,int start,int before,int count) { render.run(); }\n            public void afterTextChanged(Editable e) {}\n        });\n        render.run();\n    }\n}\n")
          PY

      - name: Restore official 0.1.8 profiles and prewarm inputs
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 5 \
            'https://github.com/igawa6/peanuts-native/releases/download/v0.1.8-1/PeanutsNative-0.1.8.apk' \
            -o "$RUNNER_TEMP/peanuts-original.apk"
          echo "e8f1afd54b785e48bbd3826e73837051d2587e71a079cf5932939d8f60b2b679  $RUNNER_TEMP/peanuts-original.apk" | sha256sum -c -
          python3 - <<'PY'
          import hashlib, os, re, zipfile
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          seeds = root / 'official-seeds'
          seeds.mkdir(exist_ok=True)
          expected = dict(line.split() for line in Path('peanuts/prewarm-sha256.tsv').read_text().splitlines() if line.strip())
          with zipfile.ZipFile(root / 'peanuts-original.apk') as apk:
              ids = sorted(m.group(1) for name in apk.namelist() if (m := re.fullmatch(r'assets/profiles/([0-9A-F]{16})\.profile\.bin', name)))
              assert len(ids) == len(set(ids)) == 76, f'Expected 76 profiles, got {len(ids)}'
              missing = [g for g in ids if not Path(f'dm/games/{g}/game.tsv').is_file()]
              assert not missing, f'Missing source profiles: {missing}'
              for g in ids:
                  data = apk.read(f'assets/profiles/{g}.seed')
                  if g in expected:
                      assert hashlib.sha256(data).hexdigest() == expected[g], f'Seed mismatch for {g}'
                  (seeds / f'{g}.seed').write_bytes(data)
              # Keep the original FreeCam game first for the default self-test.
              ids.remove('01002DA013484000')
              ids.insert(0, '01002DA013484000')
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write(f'PN_PREWARM_SEEDS={seeds}\n')
              out.write('FULL_GAMES=' + ','.join(ids) + '\n')
          print(f'Validated {len(ids)} source profiles and official release seeds')
          PY

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v4.0.3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'

      - name: Setup Dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh ninja-build cmake clang curl build-essential pkg-config

      - name: Build NX Pack Stage
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          zsh peanuts/scripts/ondevice-stage.sh "$RUNNER_TEMP/nxpacker"

      - name: Compile experimental APK
        working-directory: android/app
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon -PnxPackStage="$RUNNER_TEMP/nxpacker/stage" -PnxApp=peanuts -PnxAppId=freecam -PnxLabel='Peanuts Pro FreeCam' -PnxGenericHost=true -PnxGames="$FULL_GAMES" apk

      - name: Validate Full APK contents
        run: |
          python3 - <<'PY'
          import os, zipfile
          from pathlib import Path
          ids = set(os.environ['FULL_GAMES'].split(','))
          apks = list(Path('android/app/out').glob('*.apk'))
          assert apks, 'No APK produced'
          original = Path(os.environ['RUNNER_TEMP']) / 'peanuts-original.apk'
          with zipfile.ZipFile(original) as base:
              for path in apks:
                  with zipfile.ZipFile(path) as apk:
                      names = set(apk.namelist())
                      actual = {n.split('/')[-1].split('.')[0] for n in names if n.startswith('assets/profiles/') and n.endswith('.profile.bin')}
                      assert actual == ids, f'Profile mismatch: {ids - actual}'
                      for g in ids:
                          for suffix in ('profile.bin', 'pairs', 'seed'):
                              name = f'assets/profiles/{g}.{suffix}'
                              assert name in names, f'Missing {name}'
                              if suffix == 'seed':
                                  assert apk.read(name) == base.read(name), f'Seed differs from official: {g}'
                      with zipfile.ZipFile(__import__('io').BytesIO(apk.read('assets/pack/tools.zip'))) as tools_zip:
                          for g in ids:
                              assert f'dm/games/{g}/game.tsv' in tools_zip.namelist(), f'Missing packer profile {g}'
                      print(f'{path.name}: {len(actual)} profiles, all seeds match official APK, all packer profiles present')
          PY

      - name: Verify catalog is in compiled DEX
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          apks = list(Path('android/app/out').glob('*.apk'))
          assert apks
          for path in apks:
              with zipfile.ZipFile(path) as z:
                  dex = [z.read(n) for n in z.namelist() if n.startswith('classes') and n.endswith('.dex')]
                  for needle in (b'Supported Games', b'supported_games', b'Search games or Title ID', b'Full Catalog v1.1'):
                      assert any(needle in d for d in dex), f'Catalog missing in APK: {needle!r}'
                  print(f'{path.name}: catalog strings verified in compiled DEX')
          PY

      - name: Sign APK permanently
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          KEYSTORE="$RUNNER_TEMP/peanuts-freecam.p12"
          trap 'rm -f "$KEYSTORE" "$RUNNER_TEMP/aligned.apk"' EXIT

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"

          mkdir -p signed-apk

          shopt -s nullglob
          apks=(android/app/out/*.apk)
          test "${#apks[@]}" -gt 0

          for apk in "${apks[@]}"; do
            NAME=$(basename "$apk")

            "$BUILD_TOOLS/zipalign" -P 16 -f 4 \
              "$apk" "$RUNNER_TEMP/aligned.apk"

            "$BUILD_TOOLS/apksigner" sign \
              --ks "$KEYSTORE" \
              --ks-type PKCS12 \
              --ks-key-alias peanuts \
              --ks-pass env:KEYSTORE_PASSWORD \
              --key-pass env:KEY_PASSWORD \
              --out "signed-apk/$NAME" \
              "$RUNNER_TEMP/aligned.apk"

            "$BUILD_TOOLS/apksigner" verify \
              --verbose --print-certs "signed-apk/$NAME"
          done

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Peanuts-Pro-FreeCam-Full-Catalog-v1.1-Signed
          path: signed-apk/*.apk
          if-no-files-found: error
